name: NEON ARENA browser smoke tests
on:
  push:
    branches: [release-candidate]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 > /tmp/neon-arena-server.log 2>&1 &
      - run: npm test
